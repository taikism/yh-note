<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YH Note">
<base href="/yh-note/">
<meta name="theme-color" content="#1a1a2e">
<title>YH Note</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #252540;
    --accent: #e8a87c;
    --accent2: #c084fc;
    --text: #f0f0f8;
    --text-muted: #8888aa;
    --border: rgba(255,255,255,0.08);
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ==================== HEADER ==================== */
  /* ステータスバー透け防止の黒帯 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--safe-top);
    background: #000;
    z-index: 500;
    pointer-events: none;
  }

  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: calc(var(--safe-top) + 10px) 16px 8px;
    background: var(--bg);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 600px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: baseline;
    gap: 1px;
  }
  .logo-yh {
    font-weight: 700;
    color: var(--text);
  }
  .logo-note {
    font-weight: 400;
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .icon-btn:active { background: var(--surface); }
  .icon-btn.active-filter {
    background: #ffd23f;
  }

  /* ==================== SEARCH BAR ==================== */
  .search-bar {
    max-width: 600px;
    margin: 0 auto 12px;
    padding: 0 16px;
    display: none;
  }
  .search-bar.visible { display: block; }
  .search-bar input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
  }

  /* ==================== CATEGORY TABS ==================== */
  .category-tabs {
    position: sticky;
    top: calc(var(--safe-top) + 50px);
    z-index: 90;
    padding: 4px 0;
    background: var(--bg);
  }

  .category-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px;
    scrollbar-width: none;
  }
  .category-scroll::-webkit-scrollbar { display: none; }

  /* 年月フィルター */
  .month-filter-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 6px 16px 4px;
    scrollbar-width: none;
  }
  .month-filter-scroll::-webkit-scrollbar { display: none; }

  .month-tab {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .month-tab.active {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
    font-weight: 700;
  }

  /* さらに表示ボタン */
  .load-more-btn {
    display: block;
    width: calc(100% - 40px);
    margin: 8px 20px 20px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .load-more-btn:active { background: var(--surface2); }

  .cat-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .cat-tab.active {
    background: var(--accent);
    color: #1a1a2e;
    border-color: var(--accent);
    font-weight: 700;
  }

  /* ==================== TIMELINE ==================== */
  .timeline {
    max-width: 600px;
    margin: 0 auto;
    padding: 8px 12px calc(var(--safe-bottom) + 90px);
  }

  /* 年月ヘッダー */
  .month-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 4px 8px;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .month-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* 投稿カード */
  .post-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .post-card:nth-child(1) { animation-delay: 0.05s; }
  .post-card:nth-child(2) { animation-delay: 0.10s; }
  .post-card:nth-child(3) { animation-delay: 0.15s; }

  .post-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 10px;
  }

  .post-cats {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    flex: 1;
  }

  .cat-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .post-date {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* メディアカルーセル */
  .media-carousel {
    position: relative;
    overflow: hidden;
  }

  /* 複数写真のタイルグリッド */
  .media-tile-grid {
    display: grid;
    gap: 2px;
    background: var(--bg);
  }
  .media-tile-grid.cols-1 { grid-template-columns: 1fr; }
  .media-tile-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .media-tile-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  .media-tile {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    cursor: pointer;
    overflow: hidden;
  }
  .media-tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* 1枚のときは縦横比を自由に */
  .media-tile-grid.cols-1 .media-tile {
    aspect-ratio: auto;
  }
  .media-tile-grid.cols-1 .media-tile img {
    max-height: 460px;
    height: auto;
  }
  .media-tile-video-badge {
    position: absolute;
    top: 6px; right: 6px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }

  /* タイル上の★バッジ（頭文字入り） */
  .tile-stars {
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 80%;
    pointer-events: none;
  }
  .tile-star {
    width: 22px; height: 22px;
    font-size: 11px;
    font-weight: 700;
    color: #5a4500;
    display: flex; align-items: center; justify-content: center;
    background: #ffd23f;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .tile-comment {
    position: absolute;
    bottom: 6px; left: 6px; right: 6px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
    backdrop-filter: blur(4px);
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .media-scroll {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .media-scroll::-webkit-scrollbar { display: none; }

  .media-scroll-item {
    flex-shrink: 0;
    width: 100%;
    scroll-snap-align: start;
    position: relative;
    background: #000;
  }

  .media-scroll-item img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    display: block;
  }

  .media-scroll-item video {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    display: block;
  }

  .media-play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 22px;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }

  /* ページインジケーター */
  .media-dots {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    pointer-events: none;
  }

  .media-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transition: background 0.2s, transform 0.2s;
  }
  .media-dot.active {
    background: #fff;
    transform: scale(1.3);
  }

  /* 枚数バッジ */
  .media-count-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    backdrop-filter: blur(4px);
  }

  .post-body {
    padding: 10px 14px 12px;
  }

  .post-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .post-comment {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .post-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }

  .tag {
    font-size: 11px;
    color: var(--accent2);
  }

  .post-actions {
    display: flex;
    padding: 0 8px 8px;
    gap: 4px;
  }

  .action-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .action-btn:active { background: var(--surface2); }

  /* ==================== LIGHTBOX ==================== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.95);
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }

  .lightbox img, .lightbox video {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 8px;
  }

  .lightbox-close {
    position: absolute;
    top: calc(var(--safe-top) + 12px);
    right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* ==================== 全画面ビューア ==================== */
  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 400;
    background: #000;
    touch-action: none;
  }
  .viewer.open { display: block; }

  .viewer-track {
    display: flex;
    width: 100%;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .viewer-track::-webkit-scrollbar { display: none; }

  .viewer-page {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .viewer-media {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .viewer-page img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transform-origin: center center;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ビューア内の評価バー */
  .viewer-rating {
    flex-shrink: 0;
    background: rgba(20,20,30,0.95);
    padding: 12px 16px calc(var(--safe-bottom) + 14px);
    border-top: 1px solid var(--border);
    max-height: 42vh;
    overflow-y: auto;
  }
  .rate-stars-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .my-star-btn {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,210,63,0.5);
    background: transparent;
    color: #ffd23f;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }
  .my-star-btn.on {
    background: #ffd23f;
    color: #5a4500;
  }
  .rate-stars-display {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .rate-star {
    width: 28px; height: 28px;
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .rate-star.on { background: #ffd23f; color: #5a4500; }
  .rate-star.off { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.35); }

  .rate-comments {
    margin: 4px 0 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .rate-comment-item {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
  }
  .rate-comment-who {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #1a1a2e;
    font-size: 11px;
    font-weight: 700;
    margin-right: 6px;
    vertical-align: middle;
  }
  .rate-comment-edit {
    display: flex;
    gap: 8px;
  }
  .rate-comment-input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
  }
  .rate-comment-save {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #1a1a2e;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
  }

  .viewer-video-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: #fff;
    text-decoration: none;
  }
  .viewer-video-link .play-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(232,168,124,0.2);
    border: 2px solid rgba(232,168,124,0.8);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }

  .viewer-close {
    position: absolute;
    top: calc(var(--safe-top) + 12px);
    right: 16px;
    z-index: 410;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }

  .viewer-counter {
    position: absolute;
    top: calc(var(--safe-top) + 18px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 410;
    color: #fff;
    font-size: 14px;
    background: rgba(0,0,0,0.4);
    padding: 4px 14px;
    border-radius: 16px;
    backdrop-filter: blur(4px);
  }

  /* ==================== FAB (投稿ボタン) ==================== */
  .fab {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    right: 20px;
    z-index: 100;
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), #e07b4a);
    color: #1a1a2e;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(232,168,124,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(232,168,124,0.3); }

  /* ==================== 投稿モーダル ==================== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; align-items: flex-end; }

  .modal {
    width: 100%;
    max-height: 95vh;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 16px 0 calc(var(--safe-bottom) + 16px);
    overflow-y: auto;
    animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
  }

  .form-section { padding: 16px 20px 0; }

  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .form-input, .form-textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
    margin-bottom: 16px;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height: 80px; resize: none; line-height: 1.6; }

  /* カテゴリー複数選択 */
  .cat-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .cat-checkbox {
    display: none;
  }

  .cat-label {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .cat-checkbox:checked + .cat-label {
    border-color: var(--accent);
    background: rgba(232,168,124,0.15);
    color: var(--accent);
    font-weight: 700;
  }

  /* メディア選択 */
  .media-picker {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .media-picker::-webkit-scrollbar { display: none; }

  .add-media-btn {
    flex-shrink: 0;
    width: 80px; height: 80px;
    border-radius: 12px;
    border: 2px dashed var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 28px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 4px;
  }
  .add-media-btn span { font-size: 10px; }

  .media-thumb {
    flex-shrink: 0;
    position: relative;
    width: 80px; height: 80px;
  }
  .media-thumb img, .media-thumb video {
    width: 80px; height: 80px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
  }
  .media-remove {
    position: absolute;
    top: -6px; right: -6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #ff4444;
    color: #fff;
    border: none;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* 日付入力 */
  .date-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }
  .date-row .form-input { margin-bottom: 0; flex: 1; }
  .date-auto-btn {
    flex-shrink: 0;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    white-space: nowrap;
  }

  /* 送信ボタン */
  .submit-btn {
    width: calc(100% - 40px);
    margin: 8px 20px 0;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #e07b4a);
    color: #1a1a2e;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit-btn:disabled { opacity: 0.5; }
  .submit-btn:active { opacity: 0.8; }

  /* ==================== LOADING / EMPTY ==================== */
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 12px;
    color: var(--text-muted);
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  /* ==================== TOAST ==================== */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 100px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    border: 1px solid var(--border);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ==================== ログイン画面 ==================== */
  .login-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 600;
    background: var(--bg);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-overlay.open { display: flex; }

  .login-box {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-logo {
    font-family: 'Space Mono', monospace;
    font-size: 32px;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }
  .login-prompt {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .login-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .login-user {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .login-user:active { background: var(--surface2); transform: scale(0.96); }
  .login-initial {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #e07b4a);
    color: #1a1a2e;
    font-size: 22px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .login-name { color: var(--text); font-size: 14px; }

  /* 色マッピング */
  .c-01 { background: rgba(255,180,150,0.2); color: #ffb496; }
  .c-02 { background: rgba(150,200,255,0.2); color: #96c8ff; }
  .c-03 { background: rgba(180,255,180,0.2); color: #b4ffb4; }
  .c-06 { background: rgba(255,220,150,0.2); color: #ffdc96; }
  .c-07 { background: rgba(200,150,255,0.2); color: #c896ff; }
  .c-08 { background: rgba(255,150,200,0.2); color: #ff96c8; }
  .c-09 { background: rgba(150,255,220,0.2); color: #96ffdc; }
  .c-10 { background: rgba(255,200,100,0.2); color: #ffc864; }
  .c-11 { background: rgba(100,200,255,0.2); color: #64c8ff; }

  .c-99 { background: rgba(200,200,200,0.2); color: #c8c8c8; }

<body>

<!-- TOAST -->

<!-- ログイン画面 -->

    <div class="login-grid" id="loginGrid"></div>

<script>
// ==========================================
// 設定 — GASデプロイ後にURLを差し替え
// ==========================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbybZRzyXBqeo7QG-EtLYMEarbaQsYZH34h22iwKSqCD6OBpwq7B0BwhclPf-XWcHoOxMA/exec';

const CATEGORIES = [
  { id: 'all',                  label: 'すべて',         color: '' },
  { id: '01_koharu',            label: '🌸 心春',        color: 'c-01' },
  { id: '02_rintaro',           label: '🦁 凛太郎',      color: 'c-02' },
  { id: '03_kentaro',           label: '🌿 健太郎',      color: 'c-03' },
  { id: '06_yorrys-kitchen',    label: '🍳 Yorry\'s K',  color: 'c-06' },
  { id: '07_yh',                label: '👤 YH',          color: 'c-07' },
  { id: '08_family',            label: '👨‍👩‍👧‍👦 家族',        color: 'c-08' },
  { id: '09_people',            label: '🧑‍🤝‍🧑 人々',        color: 'c-09' },
  { id: '10_koharinkens-kitchen', label: '🌸🦁 子供キッチン', color: 'c-10' },
  { id: '11_taikism-kitchen',   label: '🍜 大貴料理',    color: 'c-11' },
  { id: '12_other-kitchen',     label: '🍽 その他料理',  color: 'c-12' },
  { id: '21_hope',              label: '✨ Hope',         color: 'c-21' },
  { id: '99_remember',          label: '💭 Remember',    color: 'c-99' },
  { id: '00_inbox',             label: '📥 Inbox',        color: 'c-00' },
];

// ユーザー定義（アカウント → 表示名・頭文字・権限）
const USERS = [
  { id: 'taikism',      name: '大貴',   initial: '大', parent: true },
  { id: 'yoriko831',    name: '頼子',   initial: '頼', parent: true },
  { id: 'koharuth',     name: '心春',   initial: '心', parent: false },
  { id: 'rintaroth725', name: '凛太郎', initial: '凛', parent: false },
  { id: 'kentaroth814', name: '健太郎', initial: '健', parent: false },
];

function getUser(id) { return USERS.find(u => u.id === id); }

// ==========================================
// State
// ==========================================
let currentUser = null;     // ログイン中のユーザーID
let currentCategory = 'all';
let currentSearch = '';
let currentMonth = 'all';
let onlyStarred = false;    // ★付き写真を含む記事のみ表示
let posts = [];
let allPosts = []; // 全件キャッシュ
let ratings = {}; // { "postId_fileIndex": [ {user, initial, star, comment} ] }
let displayCount = 30; // 表示件数
let pendingFiles = []; // {file, previewUrl, base64, mimeType, exifDate}
let existingFiles = []; // 編集時の既存写真URL配列（削除されると除外される）
let editingPostId = null;
let viewerFiles = [];   // 現在ビューアで開いているファイル配列
let viewerPostId = null; // 現在ビューアで開いている投稿ID

// ==========================================
// Init
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  currentUser = localStorage.getItem('yhnote_user');
  if (!currentUser || !getUser(currentUser)) {
    showLoginScreen();
    return;
  }
  startApp();
});

function startApp() {
  applyPermissions();
  buildCategoryTabs();
  buildFormCatGrid();
  loadPosts();
  bindEvents();
}

// ログイン画面（初回の名前選択）
function showLoginScreen() {
  const ov = document.getElementById('loginOverlay');
  const grid = document.getElementById('loginGrid');
  grid.innerHTML = USERS.map(u =>
    `<button class="login-user" data-id="${u.id}">
      <div class="login-initial">${u.initial}</div>
      <div class="login-name">${u.name}</div>
    </button>`
  ).join('');
  grid.querySelectorAll('.login-user').forEach(btn => {
    btn.addEventListener('click', () => {
      currentUser = btn.dataset.id;
      localStorage.setItem('yhnote_user', currentUser);
      ov.classList.remove('open');
      startApp();
    });
  });
  ov.classList.add('open');
}

// 権限による表示制御（子供は投稿不可）
function applyPermissions() {
  const u = getUser(currentUser);
  const fab = document.getElementById('fabBtn');
  if (u && !u.parent) {
    fab.style.display = 'none';
  } else {
    fab.style.display = 'flex';
  }
}

function buildCategoryTabs() {
  const el = document.getElementById('categoryTabs');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-tab${c.id === 'all' ? ' active' : ''}" data-id="${c.id}">${c.label}</button>`
  ).join('');
  el.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.id;
      displayCount = 30;
      applyFilters();
    });
  });
}

function buildMonthTabs(posts) {
  // 投稿から年月一覧を生成
  const monthSet = new Set();
  posts.forEach(p => {
    const d = new Date(p.shootingDate);
    if (!isNaN(d)) {
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      monthSet.add(key);
    }
  });
  // 新しい順にソート
  const months = [...monthSet].sort().reverse();

  const el = document.getElementById('monthTabs');
  if (months.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = `<button class="month-tab active" data-month="all">すべて</button>` +
    months.map(m => {
      const [y, mo] = m.split('-');
      const now = new Date();
      const isThisYear = parseInt(y) === now.getFullYear();
      const label = isThisYear ? `${parseInt(mo)}月` : `${String(y).slice(2)}年${parseInt(mo)}月`;
      return `<button class="month-tab" data-month="${m}">${label}</button>`;
    }).join('');

  el.querySelectorAll('.month-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.month-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMonth = btn.dataset.month;
      displayCount = 30;
      applyFilters();
    });
  });
}

function buildFormCatGrid() {
  const grid = document.getElementById('formCatGrid');
  grid.innerHTML = CATEGORIES.filter(c => c.id !== 'all').map(c =>
    `<label>
      <input type="checkbox" class="cat-checkbox" value="${c.id}">
      <span class="cat-label">${c.label}</span>
    </label>`
  ).join('');
}

// ==========================================
// API Calls
// ==========================================
async function apiGet(params) {
  const url = new URL(GAS_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  return res.json();
}

async function apiPost(body) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(body)
  });
  return res.json();
}

// ==========================================
// Load Posts（全件取得してキャッシュ）
// ==========================================
async function loadPosts() {
  document.getElementById('timeline').innerHTML = '<div class="loader"><div class="spinner"></div><span>読み込み中…</span></div>';
  try {
    const [postsData, ratingsData] = await Promise.all([
      apiGet({ action: 'getPosts', limit: 9999 }),
      apiGet({ action: 'getRatings' })
    ]);
    if (ratingsData && ratingsData.success) ratings = ratingsData.ratings || {};
    if (postsData.success) {
      allPosts = postsData.posts;
      buildMonthTabs(allPosts);
      displayCount = 30;
      applyFilters();
    } else {
      showError('読み込みに失敗しました');
    }
  } catch (e) {
    showError('接続エラー。GAS URLを確認してください。');
    console.error(e);
  }
}

// 評価だけ再取得（★操作後の軽量更新）
async function reloadRatings() {
  try {
    const r = await apiGet({ action: 'getRatings' });
    if (r && r.success) ratings = r.ratings || {};
  } catch (e) { console.error(e); }
}

// フィルター適用（年月・ページング）
function applyFilters() {
  let filtered = allPosts;

  // カテゴリーフィルター
  if (currentCategory !== 'all') {
    filtered = filtered.filter(p => {
      const cats = String(p.categories || '').split(',').map(c => c.trim());
      return cats.includes(currentCategory);
    });
  }

  // 年月フィルター
  if (currentMonth !== 'all') {
    const [fy, fm] = currentMonth.split('-').map(Number);
    filtered = filtered.filter(p => {
      const d = new Date(p.shootingDate);
      return d.getFullYear() === fy && (d.getMonth() + 1) === fm;
    });
  }

  // キーワード検索（ローカル）
  if (currentSearch) {
    const kw = currentSearch.toLowerCase();
    filtered = filtered.filter(p =>
      String(p.title || '').toLowerCase().includes(kw) ||
      String(p.comment || '').toLowerCase().includes(kw) ||
      String(p.tags || '').toLowerCase().includes(kw)
    );
  }

  // ★付き写真を含む記事のみ
  if (onlyStarred) {
    filtered = filtered.filter(p => {
      const files = String(p.fileUrls || '').split('|').filter(Boolean);
      return files.some((_, idx) => {
        const arr = ratings[`${p.id}_${idx}`] || [];
        return arr.some(r => r.star);
      });
    });
  }

  renderTimeline(filtered.slice(0, displayCount), filtered.length);
}

// ==========================================
// Render Timeline
// ==========================================
function renderTimeline(posts, total) {
  const el = document.getElementById('timeline');
  if (!posts.length) {
    el.innerHTML = '<div class="empty-state"><div class="emoji">📷</div><p>まだ投稿がありません。<br>＋ボタンから最初の思い出を投稿しましょう！</p></div>';
    return;
  }

  let html = '';
  let lastMonth = '';

  posts.forEach((post, i) => {
    const date = new Date(post.shootingDate);
    const month = `${date.getFullYear()}年${date.getMonth() + 1}月`;
    if (month !== lastMonth) {
      html += `<div class="month-divider">${month}</div>`;
      lastMonth = month;
    }
    html += renderCard(post, i);
  });

  // さらに表示ボタン
  if (total && posts.length < total) {
    html += `<button class="load-more-btn" id="loadMoreBtn">さらに表示（残り${total - posts.length}件）</button>`;
  }

  el.innerHTML = html;

  // さらに表示ボタンイベント
  const loadMoreBtn = el.querySelector('#loadMoreBtn');
  if (loadMoreBtn) {
    loadMoreBtn.addEventListener('click', () => {
      displayCount += 30;
      applyFilters();
    });
  }

  // タイルタップ → 全画面ビューア起動
  el.querySelectorAll('.media-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const postId = tile.dataset.postId;
      const index = parseInt(tile.dataset.index);
      const post = allPosts.find(p => String(p.id) === String(postId));
      if (post) {
        const files = String(post.fileUrls || '').split('|').filter(Boolean);
        openViewer(files, index, postId);
      }
    });
  });

  el.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEditModal(btn.dataset.id));
  });
}

function renderCard(post, i) {
  const date = new Date(post.shootingDate);
  const dateStr = `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`;

  const cats = String(post.categories || '').split(',').map(c => c.trim()).filter(Boolean);
  const catBadges = cats.map(c => {
    const def = CATEGORIES.find(x => x.id === c);
    return def ? `<span class="cat-badge ${def.color}">${def.label}</span>` : '';
  }).join('');

  const files = String(post.fileUrls || '').split('|').filter(Boolean);

  let mediaHtml = '';
  if (files.length > 0) {
    // 列数：1枚→1列、2/4枚→2列、3枚以上→3列
    let cols = 1;
    if (files.length === 2 || files.length === 4) cols = 2;
    else if (files.length >= 3) cols = 3;

    const tilesHtml = files.map((f, idx) => {
      const isVid = isVideoUrl(f);
      const thumb = fileToThumb(f);
      const rArr = ratings[`${post.id}_${idx}`] || [];
      const stars = rArr.filter(r => r.star);
      const starsHtml = stars.length
        ? `<div class="tile-stars">${stars.map(s => `<span class="tile-star">${s.initial}</span>`).join('')}</div>`
        : '';
      // コメント（10文字まで）を最初の1件だけ
      const cmt = rArr.find(r => r.comment && r.comment.trim());
      const cmtHtml = cmt
        ? `<div class="tile-comment">${escHtml(cmt.comment.slice(0, 10))}${cmt.comment.length > 10 ? '…' : ''}</div>`
        : '';
      return `<div class="media-tile" data-post-id="${post.id}" data-index="${idx}">
        <img src="${thumb}" loading="lazy">
        ${isVid ? '<div class="media-tile-video-badge">▶</div>' : ''}
        ${starsHtml}
        ${cmtHtml}
      </div>`;
    }).join('');

    mediaHtml = `<div class="media-tile-grid cols-${cols}">${tilesHtml}</div>`;
  }

  const tags = String(post.tags || '').trim();
  const tagsHtml = tags ? tags.split(/\s+/).map(t => `<span class="tag">#${t}</span>`).join('') : '';

  return `<div class="post-card" style="animation-delay:${i * 0.05}s">
    <div class="post-header">
      <div style="flex:1;min-width:0">
        ${post.title ? `<div class="post-title" style="margin-bottom:0">${escHtml(post.title)}</div>` : '<span style="color:var(--text-muted);font-size:12px">無題</span>'}
      </div>
      <span class="post-date">${dateStr}</span>
    </div>
    ${mediaHtml}
    <div class="post-body">
      ${post.comment ? `<div class="post-comment">${escHtml(post.comment)}</div>` : ''}
      ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
      <div class="post-cats" style="margin-top:10px">${catBadges || '<span style="color:var(--text-muted);font-size:11px">カテゴリなし</span>'}</div>
    </div>
    <div class="post-actions">
      ${(getUser(currentUser) || {}).parent ? `<button class="action-btn edit-btn" data-id="${post.id}">✏️ 編集</button>` : ''}
    </div>
  </div>`;
}

// ==========================================
// File Upload & Exif
// ==========================================
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readExifDate(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const bytes = new Uint8Array(e.target.result);
        // Exif: JPEGはFFD8FF E1 から始まる
        // DateTimeOriginal (0x9003) を探す
        const str = new TextDecoder('ascii', { fatal: false }).decode(bytes);
        const match = str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        if (match) {
          resolve(`${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}:${match[6]}`);
        } else {
          resolve(null);
        }
      } catch { resolve(null); }
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 65536));
  });
}

async function addFiles(files) {
  for (const file of files) {
    const previewUrl = URL.createObjectURL(file);
    let exifDate = null;

    if (file.type.startsWith('image/')) {
      // 画像：Exifから撮影日時を取得
      exifDate = await readExifDate(file);
    } else if (file.type.startsWith('video/')) {
      // 動画：ファイルの最終更新日時を使用
      exifDate = new Date(file.lastModified).toISOString().slice(0, 16);
    } else {
      // その他：投稿日時（現在時刻）
      exifDate = new Date().toISOString().slice(0, 16);
    }

    pendingFiles.push({ file, previewUrl, exifDate, mimeType: file.type });
    addMediaThumb(pendingFiles.length - 1, previewUrl, file.type);
  }

  // 最初のファイルの日時を自動セット（まだ未設定の場合）
  if (!document.getElementById('shootingDate').value) {
    const first = pendingFiles.find(f => f && f.exifDate);
    if (first) {
      document.getElementById('shootingDate').value = first.exifDate;
    }
  }
}

function addMediaThumb(idx, url, mimeType) {
  const picker = document.getElementById('mediaPicker');
  const addBtn = document.getElementById('addMediaBtn');
  const isVideo = mimeType.startsWith('video/');
  const thumb = document.createElement('div');
  thumb.className = 'media-thumb';
  thumb.dataset.idx = idx;
  thumb.innerHTML = isVideo
    ? `<video src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:12px"></video>`
    : `<img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:12px">`;
  const rm = document.createElement('button');
  rm.className = 'media-remove';
  rm.innerHTML = '✕';
  rm.onclick = () => {
    pendingFiles[idx] = null;
    thumb.remove();
  };
  thumb.appendChild(rm);
  picker.insertBefore(thumb, addBtn);
}

// 編集時：既存写真のサムネイル表示（✕で削除予定にする）
function addExistingThumb(url, idx) {
  const picker = document.getElementById('mediaPicker');
  const addBtn = document.getElementById('addMediaBtn');
  const isVideo = isVideoUrl(url);
  const fileId = getFileId(url);
  const thumbSrc = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w200` : url;

  const thumb = document.createElement('div');
  thumb.className = 'media-thumb';
  thumb.dataset.existingUrl = url;
  thumb.innerHTML = isVideo
    ? `<div style="width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,#1a1a2e,#252540);display:flex;align-items:center;justify-content:center;color:#e8a87c;font-size:22px">▶</div>`
    : `<img src="${thumbSrc}" style="width:80px;height:80px;object-fit:cover;border-radius:12px">`;
  const rm = document.createElement('button');
  rm.className = 'media-remove';
  rm.innerHTML = '✕';
  rm.onclick = () => {
    // existingFilesから除外
    existingFiles = existingFiles.filter(u => u !== url);
    thumb.remove();
  };
  thumb.appendChild(rm);
  picker.insertBefore(thumb, addBtn);
}

// ==========================================
// Submit Post（楽観的UI）
// ==========================================
async function submitPost() {
  const btn = document.getElementById('submitBtn');
  const checkedCats = [...document.querySelectorAll('#formCatGrid .cat-checkbox:checked')].map(c => c.value);
  const title = document.getElementById('postTitle').value.trim();
  const comment = document.getElementById('postComment').value.trim();
  const tags = document.getElementById('postTags').value.trim();
  const shootingDate = document.getElementById('shootingDate').value
    ? new Date(document.getElementById('shootingDate').value).toISOString()
    : new Date().toISOString();

  if (!checkedCats.length) {
    showToast('カテゴリーを選択してください');
    btn.disabled = false;
    btn.textContent = editingPostId ? '更新する' : '投稿する';
    return;
  }

  const validFiles = pendingFiles.filter(Boolean);
  const previewUrls = validFiles.map(f => f.previewUrl);
  const tempId = 'temp_' + Date.now();

  // ① モーダルを即座に閉じてホーム画面へ
  closeModal();

  // ② 仮カードをタイムライン先頭に挿入
  insertTempCard(tempId, { checkedCats, title, comment, tags, shootingDate, previewUrls });
  showToast('バックグラウンドで投稿中…');

  // ③ バックグラウンドでアップロード
  try {
    // 編集時に残した既存写真URLから開始
    const fileUrls = editingPostId ? [...existingFiles] : [];
    let thumbnailUrl = '';
    // 既存先頭がある場合はサムネに使う
    if (fileUrls.length > 0) {
      const fid = getFileId(fileUrls[0]);
      if (fid) thumbnailUrl = `https://drive.google.com/thumbnail?id=${fid}&sz=w400`;
    }

    for (const pf of validFiles) {
      const base64 = await readFileAsBase64(pf.file);
      const res = await apiPost({
        action: 'uploadFile',
        base64,
        mimeType: pf.mimeType,
        fileName: pf.file.name,
        categories: checkedCats
      });
      if (res.success) {
        fileUrls.push(res.fileUrl);
        if (!thumbnailUrl) thumbnailUrl = res.thumbnailUrl;
      }
    }

    const postData = {
      categories: checkedCats,
      title, comment, tags,
      shootingDate, fileUrls, thumbnailUrl
    };

    let res;
    if (editingPostId) {
      res = await apiPost({ action: 'updatePost', id: editingPostId, ...postData });
    } else {
      res = await apiPost({ action: 'createPost', ...postData });
    }

    if (res.success) {
      // ④ 仮カードを本物に差し替え
      removeTempCard(tempId);
      await loadPosts();
      showToast('投稿完了 ✓');
    } else {
      removeTempCard(tempId);
      showToast('⚠️ 投稿に失敗しました');
    }
  } catch (e) {
    console.error(e);
    removeTempCard(tempId);
    showToast('⚠️ エラーが発生しました');
  }
}

// 仮カードをタイムライン先頭に挿入
function insertTempCard(tempId, { checkedCats, title, comment, tags, shootingDate, previewUrls }) {
  const timeline = document.getElementById('timeline');
  const date = new Date(shootingDate);
  const dateStr = `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`;

  const cats = checkedCats.map(c => {
    const def = CATEGORIES.find(x => x.id === c);
    return def ? `<span class="cat-badge ${def.color}">${def.label}</span>` : '';
  }).join('');

  let mediaHtml = '';
  if (previewUrls.length === 1) {
    const isVid = previewUrls[0].startsWith('blob:') && pendingFiles.find(f => f && f.mimeType && f.mimeType.startsWith('video/'));
    mediaHtml = `<div class="media-grid single">
      <img src="${previewUrls[0]}" style="width:100%;max-height:480px;object-fit:cover;opacity:0.6;filter:blur(2px)">
    </div>`;
  } else if (previewUrls.length > 1) {
    const shown = previewUrls.slice(0, 2);
    mediaHtml = `<div class="media-grid multi">
      ${shown.map(u => `<img src="${u}" style="width:100%;height:180px;object-fit:cover;opacity:0.6;filter:blur(2px)">`).join('')}
    </div>`;
  }

  const tagsHtml = tags ? tags.split(/\s+/).map(t => `<span class="tag">#${t}</span>`).join('') : '';

  const card = document.createElement('div');
  card.id = tempId;
  card.className = 'post-card';
  card.style.opacity = '0.7';
  card.innerHTML = `
    <div class="post-header">
      <div style="flex:1;min-width:0">
        ${title ? `<div class="post-title" style="margin-bottom:0">${escHtml(title)}</div>` : '<span style="color:var(--text-muted);font-size:12px">無題</span>'}
      </div>
      <span class="post-date">${dateStr}</span>
    </div>
    ${mediaHtml}
    <div class="post-body">
      ${comment ? `<div class="post-comment">${escHtml(comment)}</div>` : ''}
      ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
      <div class="post-cats" style="margin-top:10px">${cats || '<span style="color:var(--text-muted);font-size:11px">カテゴリなし</span>'}</div>
      <div style="margin-top:8px;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">
        <div class="spinner" style="width:14px;height:14px;border-width:2px"></div> アップロード中…
      </div>
    </div>`;

  // タイムラインの先頭（月区切りの前）に挿入
  const firstCard = timeline.querySelector('.post-card');
  if (firstCard) {
    timeline.insertBefore(card, firstCard);
  } else {
    timeline.innerHTML = '';
    timeline.appendChild(card);
  }

// ==========================================
// 全画面ビューア（スワイプ＋ピンチ拡大）
// ==========================================
function openViewer(files, startIndex, postId) {
  const viewer = document.getElementById('viewer');
  const track = document.getElementById('viewerTrack');
  const counter = document.getElementById('viewerCounter');
  viewerFiles = files;
  viewerPostId = postId;

  // 各ファイルのページを生成
  track.innerHTML = files.map((f, idx) => {
    const isVid = isVideoUrl(f);
    const fileId = getFileId(f);
    let mediaPart;
    if (isVid) {
      const viewUrl = fileId ? `https://drive.google.com/file/d/${fileId}/view` : f;
      mediaPart = `<a class="viewer-video-link" href="${viewUrl}" target="_blank" rel="noopener">
          <div class="play-circle">▶</div>
          <span style="font-size:13px;color:#ccc">タップして動画を再生</span>
        </a>`;
    } else {
      const imgUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600` : f;
      mediaPart = `<img src="${imgUrl}" draggable="false" onerror="this.src='${f}'">`;
    }
    return `<div class="viewer-page">
      <div class="viewer-media">${mediaPart}</div>
      ${renderRatingBar(postId, idx)}
    </div>`;
  }).join('');

  viewer.classList.add('open');

  const updateCounter = (idx) => { counter.textContent = `${idx + 1} / ${files.length}`; };
  updateCounter(startIndex);

  requestAnimationFrame(() => { track.scrollLeft = startIndex * track.offsetWidth; });

  track.onscroll = () => {
    if (track._zooming) return;
    const idx = Math.round(track.scrollLeft / track.offsetWidth);
    updateCounter(idx);
  };

  track.querySelectorAll('.viewer-page img').forEach(img => setupPinchZoom(img, track));
  bindRatingBarEvents();
}

// 評価バーのHTML生成（写真ごと）
function renderRatingBar(postId, fileIndex) {
  const key = `${postId}_${fileIndex}`;
  const arr = ratings[key] || [];
  const myRating = arr.find(r => r.user === currentUser);
  const myStar = myRating && myRating.star;
  const myComment = (myRating && myRating.comment) || '';

  // 全員の★を頭文字つきで表示
  const starsRow = USERS.map(u => {
    const r = arr.find(x => x.user === u.id);
    const active = r && r.star;
    return `<span class="rate-star ${active ? 'on' : 'off'}" data-user="${u.id}" title="${u.name}">${u.initial}</span>`;
  }).join('');

  // コメント一覧（全文）
  const commentsHtml = arr.filter(r => r.comment && r.comment.trim()).map(r =>
    `<div class="rate-comment-item"><span class="rate-comment-who">${r.initial}</span> ${escHtml(r.comment)}</div>`
  ).join('');

  return `<div class="viewer-rating" data-post-id="${postId}" data-index="${fileIndex}">
    <div class="rate-stars-row">
      <button class="my-star-btn ${myStar ? 'on' : ''}" data-index="${fileIndex}">${myStar ? '★ 評価済み' : '☆ 評価する'}</button>
      <div class="rate-stars-display">${starsRow}</div>
    </div>
    ${commentsHtml ? `<div class="rate-comments">${commentsHtml}</div>` : ''}
    <div class="rate-comment-edit">
      <input type="text" class="rate-comment-input" data-index="${fileIndex}" placeholder="コメントを追加…" value="${escHtml(myComment)}">
      <button class="rate-comment-save" data-index="${fileIndex}">保存</button>
    </div>
  </div>`;
}

// 評価バーのイベント
function bindRatingBarEvents() {
  const track = document.getElementById('viewerTrack');

  // ★トグル（自分の評価）
  track.querySelectorAll('.my-star-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.index);
      const key = `${viewerPostId}_${idx}`;
      const arr = ratings[key] || [];
      const my = arr.find(r => r.user === currentUser);
      const newStar = !(my && my.star);
      const comment = (my && my.comment) || '';
      await saveRating(idx, newStar, comment);
    });
  });

  // コメント保存
  track.querySelectorAll('.rate-comment-save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.index);
      const input = track.querySelector(`.rate-comment-input[data-index="${idx}"]`);
      const key = `${viewerPostId}_${idx}`;
      const arr = ratings[key] || [];
      const my = arr.find(r => r.user === currentUser);
      const star = !!(my && my.star);
      await saveRating(idx, star, input.value.trim());
    });
  });
}

// 評価を保存してビューア・タイムラインを更新
async function saveRating(fileIndex, star, comment) {
  try {
    await apiPost({
      action: 'setRating',
      postId: viewerPostId,
      fileIndex,
      user: currentUser,
      star,
      comment
    });
    await reloadRatings();
    // ビューア内の該当ページの評価バーを再描画
    const track = document.getElementById('viewerTrack');
    const bar = track.querySelector(`.viewer-rating[data-index="${fileIndex}"]`);
    if (bar) {
      const wrap = document.createElement('div');
      wrap.innerHTML = renderRatingBar(viewerPostId, fileIndex);
      bar.replaceWith(wrap.firstElementChild);
      bindRatingBarEvents();
    }
    // タイムラインのタイルも更新
    applyFilters();
    showToast('評価を保存しました');
  } catch (e) {
    console.error(e);
    showToast('保存に失敗しました');
  }
}

// ピンチ拡大・パン操作
function setupPinchZoom(img, track) {
  let scale = 1, lastScale = 1;
  let tx = 0, ty = 0, lastTx = 0, lastTy = 0;
  let startDist = 0;
  let mode = null; // 'pinch' | 'pan'
  let startX = 0, startY = 0;

  const apply = () => {
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  };

  const dist = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  };

  img.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      mode = 'pinch';
      startDist = dist(e.touches);
      lastScale = scale;
      track._zooming = true;
    } else if (e.touches.length === 1 && scale > 1) {
      // 拡大中は1本指でパン
      mode = 'pan';
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      lastTx = tx; lastTy = ty;
      track._zooming = true;
    }
  }, { passive: false });

  img.addEventListener('touchmove', (e) => {
    if (mode === 'pinch' && e.touches.length === 2) {
      e.preventDefault();
      const d = dist(e.touches);
      scale = Math.min(Math.max(lastScale * (d / startDist), 1), 5);
      apply();
    } else if (mode === 'pan' && e.touches.length === 1 && scale > 1) {
      e.preventDefault();
      tx = lastTx + (e.touches[0].clientX - startX);
      ty = lastTy + (e.touches[0].clientY - startY);
      apply();
    }
  }, { passive: false });

  img.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      mode = null;
      if (scale <= 1.02) {
        // 等倍に戻す
        scale = 1; tx = 0; ty = 0;
        img.style.transition = 'transform 0.2s';
        apply();
        setTimeout(() => { img.style.transition = ''; }, 200);
        // スワイプ復帰
        setTimeout(() => { track._zooming = false; }, 50);
      }
    }
  });

  // ダブルタップでズームトグル
  let lastTap = 0;
  img.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 300 && e.touches.length === 0) {
      if (scale > 1) {
        scale = 1; tx = 0; ty = 0;
        track._zooming = false;
      } else {
        scale = 2.5;
        track._zooming = true;
      }
      img.style.transition = 'transform 0.2s';
      apply();
      setTimeout(() => { img.style.transition = ''; }, 200);
    }
    lastTap = now;
  });
}

async function openEditModal(id) {
  const data = await apiGet({ action: 'getPost', id });
  if (!data.success) { showToast('読み込みエラー'); return; }
  const post = data.post;
  editingPostId = id;
  pendingFiles = [];
  existingFiles = String(post.fileUrls || '').split('|').filter(Boolean);

  document.getElementById('formCatGrid').querySelectorAll('.cat-checkbox').forEach(c => {
    c.checked = String(post.categories || '').split(',').map(s => s.trim()).includes(c.value);
  });
  // 既存・新規サムネイルをクリアして既存写真を表示
  document.getElementById('mediaPicker').querySelectorAll('.media-thumb').forEach(t => t.remove());
  existingFiles.forEach((url, idx) => addExistingThumb(url, idx));
  document.getElementById('postTitle').value = post.title || '';
  document.getElementById('postComment').value = post.comment || '';
  document.getElementById('postTags').value = post.tags || '';
  const d = new Date(post.shootingDate);
  document.getElementById('shootingDate').value = d.toISOString().slice(0,16);
  document.getElementById('submitBtn').textContent = '更新する';
  document.getElementById('deleteBtn').style.display = 'block';
  document.getElementById('cancelBtn').style.display = 'block';
  document.getElementById('modal').querySelector('.modal-title').textContent = '投稿を編集';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// ==========================================
// Bind Events
// ==========================================
function bindEvents() {
  document.getElementById('fabBtn').addEventListener('click', openModal);
  document.getElementById('submitBtn').addEventListener('click', submitPost);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!editingPostId) return;
    if (!confirm('この投稿を削除しますか？')) return;
    const res = await apiPost({ action: 'deletePost', id: editingPostId });
    if (res.success) {
      closeModal();
      showToast('削除しました');
      await loadPosts();
    } else {
      showToast('削除に失敗しました');
    }
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  document.getElementById('addMediaBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', async e => {
    await addFiles([...e.target.files]);
    e.target.value = '';
  });

  document.getElementById('dateAutoBtn').addEventListener('click', async () => {
    const firstImg = pendingFiles.find(f => f && f.exifDate);
    if (firstImg) {
      document.getElementById('shootingDate').value = firstImg.exifDate;
      showToast('Exif日時をセットしました');
    } else {
      showToast('Exif情報が見つかりません');
    }
  });

  document.getElementById('searchToggle').addEventListener('click', () => {
    document.getElementById('searchBar').classList.toggle('visible');
    if (document.getElementById('searchBar').classList.contains('visible')) {
      document.getElementById('searchInput').focus();
    }
  });

  // ★フィルタートグル
  document.getElementById('starFilterBtn').addEventListener('click', () => {
    onlyStarred = !onlyStarred;
    document.getElementById('starFilterBtn').classList.toggle('active-filter', onlyStarred);
    displayCount = 30;
    applyFilters();
    showToast(onlyStarred ? '★付きの写真がある記事のみ表示' : 'すべて表示');
  });

  // ユーザーボタン（頭文字表示＋タップで切替）
  const u = getUser(currentUser);
  const userBtn = document.getElementById('userBtn');
  if (u) userBtn.textContent = u.initial;
  userBtn.addEventListener('click', () => {
    if (confirm(`現在: ${u ? u.name : '未設定'}\nユーザーを切り替えますか？`)) {
      localStorage.removeItem('yhnote_user');
      location.reload();
    }
  });

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentSearch = e.target.value.trim();
      displayCount = 30;
      applyFilters();
    }, 300);
  });
}

// ==========================================
// Utilities
// ==========================================
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isVideoUrl(url) {
  return /\.(mp4|mov|m4v|avi|webm)/i.test(url);
}

function fileToThumb(fileUrl) {
  const match = fileUrl.match(/\/d\/([^/]+)/);
  if (match) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w400`;
  return fileUrl;
}

function toDirectUrl(fileUrl) {
  const match = fileUrl.match(/\/d\/([^/]+)/);
  if (match) return `https://drive.google.com/uc?id=${match[1]}`;
  return fileUrl;
}

function toEmbedUrl(fileUrl) {
  const match = fileUrl.match(/\/d\/([^/]+)/);
  if (match) return `https://drive.google.com/file/d/${match[1]}/preview`;
  return fileUrl;
}

function getFileId(fileUrl) {
  const m1 = fileUrl.match(/\/d\/([^/]+)/);
  if (m1) return m1[1];
  const m2 = fileUrl.match(/id=([^&]+)/);
  if (m2) return m2[1];
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showError(msg) {
  document.getElementById('timeline').innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>${msg}</p></div>`;
}
</script>
</body>
